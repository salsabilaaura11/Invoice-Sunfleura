<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Generator - Sunfleura.id</title>

    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@400;600&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        invoicebg: '#121212',
                        invoicetext: '#e4e4e7',
                        invoiceborder: '#3f3f46'
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Scrollbar untuk Form */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Container Preview agar proporsi fixed seperti layout Handphone */
        #invoice-preview {
            width: 420px; 
            min-height: 700px;
            margin: 0 auto;
            box-sizing: border-box;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

    <div class="max-w-6xl mx-auto p-4 lg:p-8 grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
        
        <div class="bg-white rounded-xl shadow-lg p-6 lg:sticky lg:top-8">
            <h2 class="text-2xl font-bold mb-6 text-slate-800 border-b pb-4">Form Invoice Sunfleura.id</h2>
            
            <form id="invoice-form" class="space-y-5">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1">Tanggal</label>
                        <input type="date" id="input-date" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1">Nama Pelanggan</label>
                        <input type="text" id="input-name" placeholder="Nama Pelanggan" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
                    </div>
                </div>

                <div class="mt-6">
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-sm font-semibold text-slate-600">Daftar Barang</label>
                        <button type="button" onclick="addItemRow()" class="text-sm bg-blue-50 text-blue-600 font-semibold py-1 px-3 rounded-md hover:bg-blue-100 transition">
                            + Tambah Barang
                        </button>
                    </div>
                    
                    <div id="items-container" class="space-y-3">
                        </div>
                </div>

                <div class="pt-2">
                    <label class="block text-sm font-semibold text-slate-600 mb-1">Ongkos Kirim (Rp)</label>
                    <input type="number" id="input-ongkir" placeholder="0" class="w-full sm:w-1/2 border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" min="0">
                </div>

                <div class="flex flex-col sm:flex-row gap-3 pt-6 border-t border-slate-100">
                    <button type="button" onclick="generatePreview()" class="flex-1 bg-slate-800 text-white font-semibold py-3 rounded-lg hover:bg-slate-900 transition">
                        Update Preview
                    </button>
                    <button type="button" onclick="downloadPDF(event)" class="flex-1 bg-emerald-600 text-white font-semibold py-3 rounded-lg hover:bg-emerald-700 transition flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Unduh PDF
                    </button>
                </div>
            </form>
        </div>

        <div class="flex justify-center w-full overflow-x-auto bg-slate-200 rounded-xl p-4 lg:p-8 shadow-inner">
            
            <div id="invoice-preview" class="bg-invoicebg px-8 py-10 relative overflow-hidden shadow-2xl flex flex-col">
                
               <!-- Header Invoice -->
				<div class="flex flex-col mb-10">
					
					<!-- Atas: Logo di Tengah -->
					<div class="flex justify-center w-full mb-10 pt-2">
						<!-- Placeholder logo, ganti dengan logo.png -->
						<img src="Logo.png" alt="Logo Sunfleura" class="w-48 h-auto object-contain">
					</div>
					
					<!-- Bawah: Dibagi 2 Kolom (Kiri: Invoice+Tgl, Kanan: Nama Pelanggan) -->
					<div class="flex justify-between items-end w-full">
						<!-- Kiri: Invoice dan Tanggal -->
						<div class="text-left">
							<h1 class="text-xl font-sans font-medium tracking-[0.1 em] text-white mb-2 uppercase">Invoice</h1>
							<p class="text-sm font-sans font-bold text-white" id="prev-date">-</p>
						</div>

						<!-- Kanan: Nama Pelanggan -->
						<div class="text-right pb-0.5">
							<p class="text-xs font-sans text-gray-400 mb-1">Nama</p>
							<p class="text-lg font-sans font-bold text-white tracking-wide" id="prev-name">-</p>
						</div>
					</div>

				</div>

                <table class="w-full text-[13px] font-sans text-invoicetext mb-4">
                    <thead>
                        <tr class="border-b border-invoiceborder">
                            <th class="text-left font-bold pb-3 w-[45%]">Pesanan</th>
                            <th class="text-center font-bold pb-3 w-[15%]">Qty</th>
                            <th class="text-right font-bold pb-3 w-[20%]">Harga</th>
                            <th class="text-right font-bold pb-3 w-[20%]">Total</th>
                        </tr>
                    </thead>
                    <tbody id="prev-items-body">
                        </tbody>
                </table>
                
                <div class="border-t border-invoiceborder w-full mb-3"></div>

                <table class="w-full text-[13px] font-sans text-invoicetext">
                    <tbody id="prev-ongkir-body">
                        </tbody>
                </table>

                <div class="border-t border-invoiceborder w-full my-3"></div>

                <div class="flex justify-between items-center w-full text-white font-sans text-sm pb-1" id="prev-grand-total">
                    <span class="font-bold tracking-widest uppercase">TOTAL</span>
                    <span class="font-bold">Rp0</span>
                </div>

                <div class="border-t border-invoiceborder w-full mb-8"></div>

                <div class="flex-grow"></div>

				<div class="w-full flex justify-center mx-auto mt-8">
					<img src="qris.jpeg" alt="QR Code QRIS" class="w-64 h-auto object-contain rounded-xl shadow-lg">
				</div>

            </div>
        </div>
    </div>

    <script>
        let itemCount = 0;

        // Auto-run saat script dirender
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('input-date').value = today;
            addItemRow();
            
            // Event Listener Live Preview dari seluruh Form
            document.getElementById('invoice-form').addEventListener('input', generatePreview);
        });

        // Format angka (misal 45000 -> Rp45.000)
        function formatRupiah(angka) {
            if (!angka || isNaN(angka)) return 'Rp0';
            return 'Rp' + parseInt(angka).toLocaleString('id-ID').replace(/,/g, '.');
        }

        // Format Date YYYY-MM-DD -> D/M/YYYY
        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const [year, month, day] = dateStr.split('-');
            return `${parseInt(day)}/${parseInt(month)}/${year}`;
        }

        // Fitur Tambah Baris Dinamis
        function addItemRow() {
            itemCount++;
            const container = document.getElementById('items-container');
            const rowId = `item-row-${itemCount}`;
            
            const html = `
                <div id="${rowId}" class="item-row flex flex-col sm:flex-row gap-2 bg-slate-50 p-3 rounded-lg border border-slate-200">
                    <div class="flex-grow">
                        <input type="text" class="item-name w-full border border-slate-300 rounded-md p-2 text-sm focus:outline-none focus:border-blue-500 focus:ring-1" placeholder="Nama Barang..." required>
                    </div>
                    <div class="w-full sm:w-20">
                        <input type="number" class="item-qty w-full border border-slate-300 rounded-md p-2 text-sm text-center focus:outline-none focus:border-blue-500 focus:ring-1" placeholder="Qty" value="1" min="1" required>
                    </div>
                    <div class="w-full sm:w-32">
                        <input type="number" class="item-price w-full border border-slate-300 rounded-md p-2 text-sm focus:outline-none focus:border-blue-500 focus:ring-1" placeholder="Harga Satuan" required>
                    </div>
                    <button type="button" onclick="removeItemRow('${rowId}')" class="bg-red-100 text-red-600 px-3 py-2 rounded-md hover:bg-red-200 transition text-sm flex items-center justify-center">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
            generatePreview(); 
        }

        function removeItemRow(id) {
            const row = document.getElementById(id);
            if (row && document.querySelectorAll('.item-row').length > 1) {
                row.remove();
                generatePreview();
            } else {
                alert("Invoice minimal harus memiliki 1 daftar barang!");
            }
        }

        // Algoritma Live Rendering ke UI Kanan
        function generatePreview() {
            const dateVal = document.getElementById('input-date').value;
            const nameVal = document.getElementById('input-name').value;
            const ongkirVal = parseInt(document.getElementById('input-ongkir').value) || 0;

            document.getElementById('prev-date').innerText = formatDate(dateVal);
            document.getElementById('prev-name').innerText = nameVal ? nameVal : 'nama pelanggan';

            const itemRows = document.querySelectorAll('.item-row');
            let itemsHtml = '';
            let grandTotal = 0;
            let counter = 1;

            itemRows.forEach(row => {
                const name = row.querySelector('.item-name').value;
                const qty = parseInt(row.querySelector('.item-qty').value) || 0;
                const price = parseInt(row.querySelector('.item-price').value) || 0;
                const total = qty * price;

                if (name || price > 0) {
                    itemsHtml += `
                        <tr class="align-top">
                            <td class="pb-3 pr-2">
                                <div class="flex gap-4">
                                    <span>${counter}</span>
                                    <span class="break-words max-w-[170px]">${name}</span>
                                </div>
                            </td>
                            <td class="text-center pb-3">${qty}</td>
                            <td class="text-right pb-3">${formatRupiah(price)}</td>
                            <td class="text-right pb-3">${formatRupiah(total)}</td>
                        </tr>
                    `;
                    grandTotal += total;
                    counter++;
                }
            });

            document.getElementById('prev-items-body').innerHTML = itemsHtml;

            // Baris Ongkir Khusus
            let ongkirHtml = '';
            if (ongkirVal > 0) {
                ongkirHtml = `
                    <tr>
                        <td class="pb-2 w-[45%]">
                            <div class="flex gap-4">
                                <span>${counter}</span>
                                <span>ongkir</span>
                            </div>
                        </td>
                        <td class="text-center pb-2 w-[15%]"></td>
                        <td class="text-right pb-2 w-[20%]"></td>
                        <td class="text-right pb-2 w-[20%]">${formatRupiah(ongkirVal)}</td>
                    </tr>
                `;
                grandTotal += ongkirVal;
            } else if(itemsHtml !== '') {
               // Default Tampilan jika tidak ada ongkir
               ongkirHtml = `
                    <tr>
                        <td class="pb-2 w-[45%]">
                            <div class="flex gap-4">
                                <span>${counter}</span>
                                <span>ongkir</span>
                            </div>
                        </td>
                        <td class="text-center pb-2 w-[15%]"></td>
                        <td class="text-right pb-2 w-[20%]"></td>
                        <td class="text-right pb-2 w-[20%]">Rp0</td>
                    </tr>
                `;
            }
            document.getElementById('prev-ongkir-body').innerHTML = ongkirHtml;

            document.getElementById('prev-grand-total').innerHTML = `
                <span class="font-bold tracking-widest uppercase">TOTAL</span>
                <span class="font-bold">${formatRupiah(grandTotal)}</span>
            `;
        }

        // Algoritma Unduh via jsPDF + html2canvas
        function downloadPDF(event) {
            generatePreview(); // Pastikan state terbaru
            
            const element = document.getElementById('invoice-preview');
            const customerName = document.getElementById('input-name').value.trim() || 'Pelanggan';
            const dateVal = document.getElementById('input-date').value || 'Hari_Ini';
            
            const opt = {
                margin:       0,
                filename:     `Invoice_Sunfleura_${customerName}_${dateVal}.pdf`,
                image:        { type: 'jpeg', quality: 1.0 },
                html2canvas:  { 
                    scale: 3, 
                    useCORS: true, 
                    backgroundColor: '#121212' 
                },
                jsPDF: { 
                    unit: 'px', 
                    // Menjamin layout file PDF mengunci lebar dan tinggi container preview (layaknya HP)
                    format: [420, element.offsetHeight], 
                    orientation: 'portrait',
                    hotfixes: ["px_scaling"]
                }
            };

            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Memproses...';
            btn.disabled = true;

            html2pdf().set(opt).from(element).save().then(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }).catch(err => {
                alert("Terjadi kesalahan sistem PDF: " + err);
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
